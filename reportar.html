<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Incidente</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <h1>Registro de Incidentes</h1>

        <img src="LogoDataconta.png"
             alt="Logo Dataconta"
             class="logo">

        <p>
            Formulario para reportar incidencias relacionadas con el sistema de
            facturación electrónica.
        </p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar Incidente</a></li>
            <li><a href="tickets.html">Tickets Registrados</a></li>
        </ul>
    </nav>

    <main class="contenedor">

        <section class="card">

            <h2>Formulario de Soporte</h2>

            <form action="#" method="post" class="formulario">

                <label for="nombre">Nombre del Usuario</label>
                <input type="text"
                       id="nombre"
                       name="nombre"
                       placeholder="Ingrese su nombre completo"
                       required>

                <label for="correo">Correo Electrónico</label>
                <input type="email"
                       id="correo"
                       name="correo"
                       placeholder="ejemplo@correo.com"
                       required>

                <label for="categoria">Categoría del Incidente</label>
                <select id="categoria"
                        name="categoria"
                        required>
                    <option value="">Seleccione una opción</option>
                    <option value="errores-facturacion">Errores de Facturación</option>
                    <option value="fallos-plataforma">Fallos en la Plataforma</option>
                    <option value="firma-electronica">Firma Electrónica</option>
                    <option value="recuperacion-usuario">Recuperación de Usuario</option>
                </select>

                <fieldset>
                    <legend>Prioridad de Atención</legend>

                    <div class="opciones-radio">
                        <input type="radio"
                               id="prioridad-alta"
                               name="prioridad"
                               value="alta"
                               required>
                        <label for="prioridad-alta">Alta</label>

                        <input type="radio"
                               id="prioridad-media"
                               name="prioridad"
                               value="media">
                        <label for="prioridad-media">Media</label>

                        <input type="radio"
                               id="prioridad-baja"
                               name="prioridad"
                               value="baja">
                        <label for="prioridad-baja">Baja</label>
                    </div>
                </fieldset>

                <label for="descripcion">Descripción del Problema</label>
                <textarea id="descripcion"
                          name="descripcion"
                          rows="6"
                          placeholder="Describa detalladamente el problema presentado"
                          required></textarea>

                <div class="acciones-formulario">
                    <input type="submit"
                           value="Enviar Ticket"
                           class="btn">

                    <input type="reset"
                           value="Limpiar"
                           class="btn btn-secundario">
                </div>

            </form>

        </section>

    </main>

    <footer>
        <p>
            Help Desk - Sistema de Facturación
        </p>

        <img src="LogoDataconta.png"
             alt="Logo Dataconta"
             class="logo-footer">
    </footer>

</body>
</html>
